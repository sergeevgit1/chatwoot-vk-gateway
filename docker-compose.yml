services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-https://vk.youcompany.ru}
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-50}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-web.rule=Host(`vk.youcompany.ru`)
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-web.entrypoints=web
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-web.middlewares=redirect-to-https@file
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-web.service=companyos-vk-gateway-hnfabo-22-web
      - traefik.http.services.companyos-vk-gateway-hnfabo-22-web.loadbalancer.server.port=3000
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-websecure.rule=Host(`vk.youcompany.ru`)
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-websecure.entrypoints=websecure
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-websecure.service=companyos-vk-gateway-hnfabo-22-web
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-websecure.tls=true
      - traefik.http.routers.companyos-vk-gateway-hnfabo-22-websecure.tls.certresolver=letsencrypt

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway -d gateway']
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - '5432'

volumes:
  gateway-postgres:

networks:
  dokploy-network:
    external: true
